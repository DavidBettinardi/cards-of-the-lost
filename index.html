<body>
<p id="m">Opening the hatch…</p>
<script>
(async () => {
  const m = document.getElementById('m');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  let k = new URLSearchParams(location.hash.slice(1)).get('k');
  try { if (k) localStorage.setItem('cotl.k', k); else k = localStorage.getItem('cotl.k'); } catch (e) {}
  if (!k){ m.textContent = 'This door is locked. Ask whoever sent you for the whole link.'; return; }
  try {
    const bytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt']);
    const box = new Uint8Array(await (await fetch('game.bin', {cache: 'no-cache'})).arrayBuffer());
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: box.slice(0, 12)}, key, box.slice(12)));
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { localStorage.removeItem('cotl.k'); } catch (_) {}
    m.textContent = 'That key does not fit this door. Ask for the link again.';
  }
})();
</script>
